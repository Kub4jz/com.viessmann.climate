<!doctype html>
<html>
<head>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>

<body>
<p>
    To connect a Viessmann device to Homey, first register to the
    <a href="https://developer.viessmann-climatesolutions.com" target="_blank">Viessmann Developer Portal</a>
    and create a client.
    <br>
    Use "<code>https://callback.athom.com/oauth2/callback</code>" as the redirect URI.
</p>

<fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.title"></legend>
    <div class="homey-form-group">
        <label class="homey-form-label" for="clientid">Client ID</label>
        <input class="homey-form-input" id="clientid" type="text" value=""/>
    </div>
    <label class="homey-form-label" for="polling">Polling Interval</label>
    <select class="homey-form-select" name="polling" id="polling">
        <option value="3">3 Minutes</option>
        <option value="5">5 Minutes</option>
        <option value="10">10 Minutes</option>
        <option value="30">30 Minutes</option>
        <option value="60">60 Minutes</option>
    </select>
</fieldset>

<p>
    <button id="save" class="homey-button-primary-full">Save Changes</button>
</p>

<script type="text/javascript">

    const clientId = document.getElementById('clientid');
    const pollingElement = document.getElementById('polling');
    const saveElement = document.getElementById('save');
    let oldClientId = '';
    let oldPolling = '';

    function onHomeyReady(Homey) {
        // Tell Homey we're ready to be displayed
        Homey.ready();

        Homey.get('clientId', function (err, value) {
            if (err) return Homey.alert(err);
            clientId.value = value;
            oldClientId = value;
        });

        Homey.get('polling', function (err, polling) {
            if (err) return Homey.alert(err);
            if (polling === null || polling === undefined || polling === '') {
                polling = '5';
            }
            pollingElement.value = polling;
            oldPolling = polling;
        });

        saveElement.addEventListener('click', async function (e) {
            if (oldClientId != clientId.value || oldPolling != pollingElement.value) {
                // document.getElementById('save').classList.add("is-loading");
                await Homey.set('clientId', clientId.value, function (err) {
                    if (err) return Homey.alert(err);
                });
                await Homey.set('polling', pollingElement.value, function (err) {
                    if (err) return Homey.alert(err);
                });
            }
        });
    }
</script>

</body>

</html>
